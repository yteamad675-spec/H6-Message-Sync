name: Run My Script

on:
  workflow_dispatch: # Позволяет запускать вручную и по API

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          # Сюда передаются твои переменные/токены из Secrets GitHub
          MY_SECRET_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
        run: python main.py
